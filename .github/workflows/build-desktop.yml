name: Build Desktop Installers

# Trigger: push a version tag like v1.0.0
# Or run manually from the Actions tab (workflow_dispatch) — manual runs build Windows only
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  # ── macOS Apple Silicon (arm64) ─────────────────────────────────────────────
  # Skipped on manual workflow_dispatch (Mac release is stable; rebuild on tag only)
  build-mac-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Bundle Python (arm64)
        working-directory: desktop
        run: node scripts/bundle-python.js

      - name: Import certificate into keychain
        env:
          CSC_LINK: ${{ secrets.APPLE_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=temp-keychain-password

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CSC_LINK" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm /tmp/cert.p12

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build DMG (arm64)
        working-directory: desktop
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          CSC_NAME: Developer ID Application
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.dmg

  # ── macOS Intel (x64) ───────────────────────────────────────────────────────
  build-mac-x64:
    name: macOS (Intel)
    runs-on: macos-13
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Bundle Python (x64)
        working-directory: desktop
        run: node scripts/bundle-python.js

      - name: Import certificate into keychain
        env:
          CSC_LINK: ${{ secrets.APPLE_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=temp-keychain-password

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CSC_LINK" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm /tmp/cert.p12

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build DMG (x64)
        working-directory: desktop
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          CSC_NAME: Developer ID Application
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --x64

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.dmg

  # ── Windows x64 ─────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        working-directory: desktop
        run: npm ci

      - name: Download LibreOffice MSI
        working-directory: desktop
        shell: pwsh
        run: |
          $version = "25.8.7"
          $url = "https://download.documentfoundation.org/libreoffice/stable/$version/win/x86_64/LibreOffice_${version}_Win_x86-64.msi"
          New-Item -ItemType Directory -Force -Path libreoffice | Out-Null
          Write-Host "Downloading LibreOffice $version for Windows..."
          Invoke-WebRequest -Uri $url -OutFile "libreoffice/LibreOffice.msi" -UseBasicParsing
          Write-Host "Downloaded: $((Get-Item libreoffice/LibreOffice.msi).Length / 1MB) MB"

      - name: Bundle Python (x64)
        working-directory: desktop
        run: node scripts/bundle-python.js

      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
